# nginx site for eplug.mn -> OCPP 1.6J Central System (CSMS)
#
#   https://eplug.mn/                    admin console (Next.js, port 3001)
#   https://eplug.mn/api/...             REST API      (Express, API_BASE_PATH=/api)
#   https://eplug.mn/api/health          health check
#   wss://eplug.mn/ocpp/{chargePointId}  charge point WebSocket
#
# The /api prefix is NOT stripped: the backend itself serves /api/*, so the same
# paths work locally (http://localhost:3000/api/...) and in production.
#
# TLS is terminated here with the RapidSSL certificate, so the Node process keeps
# TLS_ENABLED=false and runs plain HTTP on 127.0.0.1:3000.
# Install the certificate files with deploy/install-nginx-ubuntu.sh.

upstream csms_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Admin console (evChargerAdmin, Next.js on :3001). It reaches the API
# server-side over loopback and keeps the JWT in an httpOnly cookie, so the
# browser never calls /api/ directly and no CORS grant is needed.
# Its own route handlers live under /console-api/ so they cannot collide with
# the backend's /api/.
upstream csms_admin {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name eplug.mn www.eplug.mn;

    # Keep ACME/HTTP validation working if you ever switch issuers.
    location /.well-known/ {
        root /var/www/html;
    }

    location / {
        return 301 https://eplug.mn$request_uri;
    }
}

server {
    # `ssl http2` on one line works on nginx 1.18 (Ubuntu 22.04) through 1.29;
    # on 1.25+ it logs a deprecation notice — replace with `listen 443 ssl;` plus
    # a separate `http2 on;` if you only run 1.25 or newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eplug.mn www.eplug.mn;

    # ---- TLS (RapidSSL / DigiCert, expires 2027-03-05) ----
    # fullchain.crt = eplug.crt + bundle_files.crt (leaf, intermediate, root)
    ssl_certificate         /etc/nginx/ssl/eplug.mn/fullchain.crt;
    ssl_certificate_key     /etc/nginx/ssl/eplug.mn/eplug.mn.key;
    ssl_trusted_certificate /etc/nginx/ssl/eplug.mn/bundle_files.crt;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # TLS 1.2 suites required of the Central System by the OCA security white
    # paper (A00.FR.317); TLS 1.3 picks its own.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 4m;
    access_log /var/log/nginx/eplug.mn.access.log;
    error_log  /var/log/nginx/eplug.mn.error.log;

    # ---- REST API ----
    location /api/ {
        proxy_pass         http://csms_backend;   # no trailing slash: keeps the /api prefix
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Server-Sent Events on /api/events/stream must not be buffered.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # ---- OCPP WebSocket (charge points) ----
    location /ocpp/ {
        proxy_pass         http://csms_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # OCPP connections are long-lived; heartbeat is 300 s by default.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # Root health probe (also available at /api/health).
    location = /health {
        proxy_pass       http://csms_backend;
        proxy_set_header Host $host;
    }

    # ---- Admin console: live event stream ----
    # The console re-streams /api/events/stream to the browser from its own
    # server, so this one route needs the same no-buffering treatment as /api/.
    location = /console-api/stream {
        proxy_pass         http://csms_admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # ---- Admin console: immutable build assets ----
    # Hashed filenames, so they can be cached indefinitely.
    location /_next/static/ {
        proxy_pass       http://csms_admin;
        proxy_set_header Host $host;
        add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Admin console (everything else) ----
    location / {
        proxy_pass         http://csms_admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 60s;
    }
}
